receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    send_batch_size: 128
    timeout: 1s
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
exporters:
  otlphttp/doctor:
    endpoint: http://async-trace-doctor:4318
    tls:
      insecure: true
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/doctor]

apiVersion: asynctracedoctor.io/v1alpha1
semanticConventionVersion: "1.43.0"
settings:
  correlationWindow: 5m
  queueLatencyThreshold: 30s
  clockSkewTolerance: 1s
  duplicateThreshold: 2
  failOnSeverity: error
  # Offline audit inputs are treated as finalized, controlled datasets. Live
  # receiver windows always remain coverage-unknown regardless of this value.
  inputCompleteness: complete
  failOnInsufficientEvidence: false
redactAttributes:
  - enduser.id
  - user.email
  - messaging.message.body
  - messaging.kafka.message.key
rules:
  - id: ATD-SEM-001
    check: missing_service_name
    enabled: true
    severity: error
    message: Messaging span is missing service.name.
    suggestedFix: Set OTEL_SERVICE_NAME or service.name on the Resource.
  - id: ATD-SEM-002
    check: missing_messaging_system
    enabled: true
    severity: error
    message: Messaging span is missing messaging.system.
    suggestedFix: Set messaging.system to the canonical broker identifier, such as kafka or rabbitmq.
  - id: ATD-SEM-003
    check: missing_destination
    enabled: true
    severity: warning
    message: Messaging operation has no identifiable destination.
    suggestedFix: Record messaging.destination.name when the destination is known and not anonymous.
  - id: ATD-SEM-004
    check: invalid_operation
    enabled: true
    severity: error
    message: messaging.operation.type is missing or invalid.
    suggestedFix: Use create, send, receive, process, or settle according to the messaging semantic conventions.
  - id: ATD-SEM-005
    check: invalid_span_kind
    enabled: true
    severity: error
    message: SpanKind does not match messaging.operation.type.
    suggestedFix: Use PRODUCER for create, CONSUMER for process, and the convention-defined kind for other operations.
  - id: ATD-SEM-006
    check: invalid_span_identity
    enabled: true
    severity: error
    message: Messaging span has an invalid OTLP trace or span identity.
    suggestedFix: Emit a 16-byte trace ID and 8-byte span ID and reject zero or truncated identifiers at instrumentation boundaries.
  - id: ATD-SEM-007
    check: invalid_timestamps
    enabled: true
    severity: error
    message: Messaging span has missing or impossible timestamps.
    suggestedFix: Record non-zero start/end timestamps and ensure span end does not precede span start.
  - id: ATD-SEM-008
    check: invalid_context_reference
    enabled: true
    severity: error
    message: Messaging span contains an invalid link or parent context identity.
    suggestedFix: Propagate non-zero 16-byte trace IDs and 8-byte span IDs and reject truncated messaging headers.
  - id: ATD-CTX-001
    check: missing_consumer_context
    enabled: true
    severity: error
    message: Consumer process span carries no message-creation context link or parent reference.
    suggestedFix: Inject the message creation context at the producer and extract it into a span link at the consumer.
    appliesTo:
      operations: [process]
  - id: ATD-COV-001
    check: unresolved_consumer_context
    enabled: true
    severity: warning
    message: Consumer carries context that cannot be resolved in the available telemetry window.
    suggestedFix: Check sampling, export loss, state eviction, and collector routing before declaring propagation broken.
    appliesTo:
      operations: [receive, process]
  - id: ATD-COR-001
    check: orphan_producer
    enabled: true
    severity: error
    message: Producer has no correlated consumer in the available bounded window.
    suggestedFix: Verify telemetry coverage before investigating delivery, then widen the window only when broker delay justifies it.
    appliesTo:
      operations: [create, send]
  - id: ATD-COR-002
    check: orphan_consumer
    enabled: true
    severity: error
    message: Consumer has no correlated producer in the available bounded window.
    suggestedFix: Check telemetry coverage, then verify extraction and the message-creation context link.
    appliesTo:
      operations: [receive, process]
  - id: ATD-BAT-001
    check: batch_links_incomplete
    enabled: true
    severity: error
    message: Batch consumer has fewer unique message-context links than its declared message count.
    suggestedFix: Add one span link per message creation context and attach per-message attributes to each link.
    appliesTo:
      operations: [receive, process]
  - id: ATD-DUP-001
    check: duplicate_processing
    enabled: true
    severity: warning
    message: Duplicate or retry processing exceeds the configured threshold.
    suggestedFix: Inspect retry policy and idempotency; preserve messaging.message.id when the broker provides it.
    appliesTo:
      operations: [process]
  - id: ATD-LAT-001
    check: queue_latency_high
    enabled: true
    severity: warning
    message: Correlated producer-to-consumer queue latency exceeds policy.
    suggestedFix: Check consumer lag, broker saturation, partitions, prefetch, and backpressure.
  - id: ATD-TIM-001
    check: clock_skew
    enabled: true
    severity: warning
    message: Consumer time precedes the correlated producer beyond the configured clock-skew tolerance.
    suggestedFix: Check NTP/PTP synchronization and host clock health before trusting cross-host latency.
  - id: ATD-TOP-001
    check: runtime_topology_mismatch
    enabled: true
    severity: warning
    message: Runtime async topology differs from the configured expected topology.
    suggestedFix: Confirm the deployment and routing configuration, then update expectedEdges through review if the change is intentional.
topology:
  # Empty by default. Core fields accept * wildcards. Consumer group,
  # subscription, environment, namespaces, and brokerAddress are optional
  # match dimensions. requirePerMessage is opt-in because fan-out requirements
  # cannot be inferred from telemetry alone.
  expectedEdges: []
  # Explicit deny rules work even when expectedEdges is empty.
  deniedEdges: []
  # Use for reviewed exceptional paths such as DLQ/replay traffic.
  ignoredEdges: []

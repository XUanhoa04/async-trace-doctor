<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">AsyncTraceDoctor broken and verified messaging trace comparison</title>
  <desc id="desc">A producer and consumer appear healthy, but a missing creation-context link makes the trace causally unsafe. AsyncTraceDoctor identifies the missing link and verifies it after repair.</desc>
  <rect width="1200" height="480" rx="24" fill="#0d1117"/>
  <text x="44" y="52" fill="#f0f6fc" font-family="system-ui,sans-serif" font-size="24" font-weight="700">The green trace that lies</text>
  <text x="44" y="82" fill="#8b949e" font-family="system-ui,sans-serif" font-size="16">Both handlers succeeded. Only one trace preserves causality.</text>

  <g transform="translate(44 118)">
    <rect width="530" height="310" rx="16" fill="#161b22" stroke="#30363d"/>

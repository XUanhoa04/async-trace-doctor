    <text x="42" y="228" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="14">creation-context link: missing</text>
    <text x="42" y="251" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="14">impact: checkout → fraud edge is unsafe for RCA</text>
    <text x="42" y="274" fill="#8b949e" font-family="system-ui,sans-serif" font-size="13">partition=7 · offset=9182 · group=fraud-v1</text>
  </g>

  <g transform="translate(626 118)">

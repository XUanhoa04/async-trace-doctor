    <text x="94" y="126" text-anchor="middle" fill="#aff5b4" font-family="system-ui,sans-serif" font-size="12">send orders · OK</text>
    <rect x="198" y="76" width="120" height="64" rx="12" fill="#1f6feb"/>
    <text x="258" y="113" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Kafka</text>
    <rect x="366" y="76" width="140" height="64" rx="12" fill="#1f6f43"/>
    <text x="436" y="105" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="15" font-weight="600">fraud</text>
    <text x="436" y="126" text-anchor="middle" fill="#aff5b4" font-family="system-ui,sans-serif" font-size="12">process · OK</text>
    <path d="M164 108 H198" stroke="#58a6ff" stroke-width="4"/>
    <path d="M318 108 H366" stroke="#f85149" stroke-width="4" stroke-dasharray="8 7"/>
    <circle cx="342" cy="108" r="12" fill="#f85149"/>
    <text x="342" y="113" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="14" font-weight="700">!</text>
    <rect x="24" y="174" width="482" height="108" rx="12" fill="#0d1117" stroke="#f85149"/>
